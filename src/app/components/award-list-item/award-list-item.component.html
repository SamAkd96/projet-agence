<div class="award-item">
  <img [src]="imageUrl" alt="Award Image" class="award-image" />

  <div class="award-details">
    <h4 class="award-title">{{ title }}</h4>
    <span class="award-date">{{ date }}</span>
  </div>

  <div class="award-info">
    <span class="award-name">{{ awardName }}</span>
    <img [src]="awardLogo" alt="Award Logo" class="award-logo" />
  </div>
</div>
