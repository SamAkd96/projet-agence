<div [ngClass]="customClass">
  <div class="testimonial-card" >
    <div class="stars">⭐⭐⭐⭐⭐</div>
    <p class="testimonial-text">{{ text }}</p>
    <div class="profile">
      <img [src]="image" [alt]="name">
      <div class="info">
        <h3>{{ name }}</h3>
        <p class="company">{{ company }}</p>
      </div>
    </div>
  </div>
</div>
