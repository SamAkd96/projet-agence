<div class="event-card">
  <div class="date">
    <h1>{{ day }}</h1>
    <p>{{ month }}<br>{{ year }}</p>
  </div>
  <div class="details">
    <p class="time"><span class="icon">&#x23F0;</span> {{ time }}</p>
    <hr>
    <h3>{{ title }}</h3>
    <p>{{ description }}</p>
    <a href="#">{{ linkText }}</a>
  </div>
</div>
